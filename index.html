<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Taroq | Premium soch taroq</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* Siz bergan ranglar jadvalidagi aniq ranglar */
    :root {
      --bg-deep: #0F172A;      /* Asosiy fon */
      --bg-surface: #1E293B;   /* Bloklar va tugmalar uchun yordamchi fon */
      --accent-neon: #38BDF8;  /* Neon havorang – urg‘u rang */
      --text-light: #F8FAFC;   /* Deyarli oq matn */
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-deep);
      color: var(--text-light);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
      margin: 0;
      padding: 0;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-surface);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--accent-neon);
      border-radius: 10px;
    }

    /* Input va textarea – qorong‘i mavzu */
    input, textarea {
      background-color: var(--bg-deep);
      border: 1px solid #334155;
      color: var(--text-light);
      border-radius: 1rem;
      transition: all 0.2s ease;
      font-size: 1rem;
      outline: none;
    }
    input:focus, textarea:focus {
      border-color: var(--accent-neon);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
      background-color: #131E30;
    }
    input::placeholder, textarea::placeholder {
      color: #64748B;
      font-weight: 400;
    }

    /* Asosiy harakatga chaqiruv tugmasi – neon havorang */
    .btn-accent {
      background-color: var(--accent-neon);
      color: #0F172A;
      font-weight: 700;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-accent:hover:not(:disabled) {
      background-color: #0EA5E9;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(56, 189, 248, 0.35);
    }
    .btn-accent:active:not(:disabled) {
      transform: translateY(0);
    }
    .btn-accent:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      background-color: #475569;
      color: #cbd5e1;
    }

    /* Bekor qilish tugmasi */
    .btn-outline-accent {
      background: transparent;
      border: 1.5px solid #334155;
      color: #94A3B8;
      font-weight: 600;
      transition: all 0.2s ease;
    }
    .btn-outline-accent:hover {
      background-color: rgba(51, 65, 85, 0.5);
      color: #CBD5E1;
    }

    /* Modal oyna animatsiyalari */
    .modal-hidden {
      display: none !important;
    }
    .modal-flex {
      display: flex !important;
      animation: fadeIn 0.3s ease-out forwards;
    }
    .modal-content-show {
      animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body class="min-h-screen antialiased">

  <div class="max-w-md mx-auto px-4 py-6 md:py-8">
    <!-- Asosiy karta (yordamchi fon #1E293B) -->
    <div class="bg-[#1E293B] rounded-3xl shadow-2xl overflow-hidden border border-[#334155]/50">
      
      <!-- Mahsulot rasmi -->
      <div class="w-full bg-[#0F172A]/40 relative">
        <img id="product-image" 
             src="https://via.placeholder.com/600x500/1E293B/38BDF8?text=Ikki+Tomonlama+Taroq" 
             class="w-full object-cover" 
             alt="Ikki tomonlama professional taroq"
             style="aspect-ratio: 600/500; background: #0F172A;">
        <!-- Kichik badge -->
        <div class="absolute top-4 right-4 bg-black/60 backdrop-blur-md px-3 py-1.5 rounded-full text-xs font-semibold border border-white/10 text-[#38BDF8]">
          Premium Sifat
        </div>
      </div>

      <!-- Matn va tugmalar qismi -->
      <div class="p-6 space-y-5">
        <div>
          <h1 class="text-3xl font-bold tracking-tight text-[#F8FAFC]">Ikki tomonlama taroq</h1>
          <p class="text-[#CBD5E1] text-[15px] mt-2 leading-relaxed">
            2 tomonga ochiladi va yopiladi. Yangicha uslubda soch tarash uchun eng yaxshi tanlov.
          </p>
        </div>

        <!-- Narx va mavjudlik -->
        <div class="flex justify-between items-end flex-wrap gap-3 p-4 bg-[#0F172A]/50 rounded-2xl border border-[#334155]/50">
          <div>
            <p class="text-xs text-[#94A3B8] font-medium mb-1">Maxsus narx</p>
            <div>
              <span id="price" class="text-3xl font-extrabold text-[#38BDF8] tracking-tight"></span>
              <span class="text-[#94A3B8] text-lg ml-1 font-medium">so‘m</span>
            </div>
          </div>
          <div id="stock" class="text-right text-sm font-medium"></div>
        </div>

        <!-- Video havola (agar mavjud bo‘lsa) -->
        <a id="video-btn" href="#" target="_blank" rel="noopener noreferrer"
           class="flex items-center justify-center gap-2 text-sm font-medium border rounded-xl py-3 px-4 transition-all hover:bg-[#38BDF8]/10"
           style="border-color: rgba(56, 189, 248, 0.3); color: #38BDF8; display: none;">
          <span class="text-lg">📹</span> Qanday ishlatishni ko‘rish
        </a>

        <!-- ASOSIY TUGMA -->
        <button id="buy-button" class="btn-accent w-full py-4 rounded-2xl text-lg shadow-lg flex items-center justify-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
          </svg>
          Buyurtma berish
        </button>

        <p class="text-center text-xs text-[#64748B] pt-2 flex items-center justify-center gap-1.5 font-medium">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-emerald-400" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
          </svg>
          Biz bilan bog'laning. Telegram orqali!
        </p>
      </div>
    </div>
  </div>

  <!-- MODAL: telefon va miqdor kiritish oynasi (rasmiylashtirish qismi) -->
  <div id="modal" class="modal-hidden fixed inset-0 bg-[#0F172A]/80 backdrop-blur-sm items-end justify-center z-50">
    <!-- Modal Content -->
    <div id="modal-content" class="bg-[#1E293B] w-full max-w-md rounded-t-[2rem] shadow-[0_-10px_40px_rgba(0,0,0,0.3)] max-h-[90vh] flex flex-col relative border-t border-[#334155]">
      
      <!-- Drag handle (iOS style) -->
      <div class="w-full flex justify-center pt-3 pb-2 absolute top-0 left-0 z-10">
        <div class="w-12 h-1.5 bg-[#334155] rounded-full"></div>
      </div>

      <!-- Scrollable content -->
      <div class="p-6 pt-10 space-y-5 overflow-y-auto">
        <div class="flex justify-between items-center pb-2">
          <div>
            <h2 class="text-2xl font-bold text-[#F8FAFC] tracking-tight">Rasmiylashtirish</h2>
            <p class="text-sm text-[#94A3B8] mt-1">Ma'lumotlaringizni kiriting</p>
          </div>
          <button id="closeModalBtn" class="w-9 h-9 flex items-center justify-center rounded-full bg-[#334155]/50 text-[#94A3B8] hover:bg-[#334155] hover:text-white transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
            </svg>
          </button>
        </div>

        <!-- Miqdor (nechta dona) - MAJBURIY -->
        <div class="space-y-1.5">
          <label class="block text-sm font-semibold text-[#CBD5E1] ml-1">Nechta kerak? <span class="text-red-400">*</span></label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-xl">📦</span>
            <input id="qty" type="number" min="1" value="1" class="w-full pl-12 pr-5 py-3.5 rounded-2xl text-base font-medium">
          </div>
        </div>

        <!-- Telefon raqam - MAJBURIY -->
        <div class="space-y-1.5">
          <label class="block text-sm font-semibold text-[#CBD5E1] ml-1">Telefon raqam <span class="text-red-400">*</span></label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-xl">📞</span>
            <input id="phone" type="tel" placeholder="+998 XX XXX XX XX" class="w-full pl-12 pr-5 py-3.5 rounded-2xl text-base font-medium">
          </div>
        </div>

        <!-- Qo‘shimcha: ism va manzil (ixtiyoriy) -->
        <div class="space-y-1.5">
          <label class="block text-sm font-semibold text-[#94A3B8] ml-1">Ism familiya <span class="text-[#64748B] font-normal">(ixtiyoriy)</span></label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-xl text-[#64748B]">👤</span>
            <input id="name" type="text" placeholder="Ismingiz" class="w-full pl-12 pr-5 py-3.5 rounded-2xl text-base">
          </div>
        </div>

        <div class="space-y-1.5">
          <label class="block text-sm font-semibold text-[#94A3B8] ml-1">Manzil <span class="text-[#64748B] font-normal">(ixtiyoriy)</span></label>
          <div class="relative">
            <span class="absolute top-3.5 left-0 pl-4 text-xl text-[#64748B]">📍</span>
            <textarea id="address" rows="2" placeholder="Shahar, ko‘cha, uy..." class="w-full pl-12 pr-5 py-3.5 rounded-2xl text-base resize-none"></textarea>
          </div>
        </div>

        <!-- Jami hisob bloki -->
        <div class="bg-[#0F172A] p-4 rounded-2xl border border-[#334155] flex justify-between items-center mt-2 shadow-inner">
           <span class="text-[#94A3B8] text-sm font-medium">Jami summa:</span>
           <span class="text-xl font-bold text-[#38BDF8]" id="modal-total-price">0 so‘m</span>
        </div>

        <!-- Tugmalar -->
        <div class="grid grid-cols-2 gap-3 pt-2 pb-4">
          <button id="cancelBtn" class="btn-outline-accent py-3.5 rounded-2xl text-base">Bekor qilish</button>
          <button id="confirmBtn" class="btn-accent py-3.5 rounded-2xl text-base shadow-md">Tasdiqlash</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ======================= KONFIGURATSIYA =======================
    const SUPABASE_URL = "https://jhyihdwixnnvesbgesjc.supabase.co"
    const SUPABASE_KEY = "sb_publishable_wKLwFZ3IOlS52mGxwxeOZQ_m2h4nSCJ"
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

    let settings = {
      stock: 10,        
      price: 75000,
      is_active: true,  
      video_url: null
    }

    // DOM elementlari
    const priceSpan = document.getElementById('price')
    const stockDiv = document.getElementById('stock')
    const videoBtn = document.getElementById('video-btn')
    const buyButton = document.getElementById('buy-button')
    
    const modal = document.getElementById('modal')
    const modalContent = document.getElementById('modal-content')
    const modalTotalPrice = document.getElementById('modal-total-price')
    
    const qtyInput = document.getElementById('qty')
    const phoneInput = document.getElementById('phone')
    const nameInput = document.getElementById('name')
    const addressInput = document.getElementById('address')
    
    const closeModalBtn = document.getElementById('closeModalBtn')
    const cancelBtn = document.getElementById('cancelBtn')
    const confirmBtn = document.getElementById('confirmBtn')

    function formatNumber(num) {
      return num.toLocaleString('uz-UZ')
    }

    // Modal ichidagi jami summani hisoblash
    function updateModalTotal() {
      const qty = parseInt(qtyInput.value) || 0;
      const total = qty * settings.price;
      modalTotalPrice.innerText = formatNumber(total) + " so‘m";
    }

    // Miqdor o'zgarganda summani yangilash
    qtyInput.addEventListener('input', updateModalTotal);

    function updateUI() {
      if (priceSpan) priceSpan.innerText = formatNumber(settings.price)

      if (!settings.is_active) {
        stockDiv.innerHTML = `<span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-red-500/10 text-red-400 text-sm font-semibold border border-red-500/20"><span class="w-2 h-2 rounded-full bg-red-500"></span> To‘xtatilgan</span>`
        if (buyButton) buyButton.disabled = true
      } 
      else if (settings.stock <= 0) {
        stockDiv.innerHTML = `<span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-amber-500/10 text-amber-400 text-sm font-semibold border border-amber-500/20"><span class="w-2 h-2 rounded-full bg-amber-500"></span> Tugagan</span>`
        if (buyButton) buyButton.disabled = true
      } 
      else {
        stockDiv.innerHTML = `<span class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-[#38BDF8]/10 text-[#38BDF8] text-sm font-semibold border border-[#38BDF8]/30"><span class="w-2 h-2 rounded-full bg-[#38BDF8] animate-pulse"></span> ${settings.stock} dona mavjud</span>`
        if (buyButton) buyButton.disabled = false
      }

      if (settings.video_url && settings.video_url.trim() !== "") {
        videoBtn.href = settings.video_url
        videoBtn.style.display = "flex"
      } else {
        videoBtn.style.display = "none"
      }
    }

    async function loadData() {
      try {
        const { data, error } = await supabaseClient
          .from('bot_settings')
          .select('*')
          .eq('id', 1)
          .single()
        
        if (!error && data) {
          settings = {
            stock: (data.stock !== undefined && data.stock !== null) ? data.stock : 10,
            price: data.price ?? 75000,
            is_active: data.is_active ?? true,
            video_url: data.video_url ?? null
          }
        }
      } catch (err) {
        console.error("Yuklash xatosi:", err)
      } finally {
        updateUI()
      }
    }

    function openModal() {
      if (!settings.is_active) {
        alert("Hozirgi vaqtda savdo to‘xtatilgan.");
        return;
      }
      if (settings.stock <= 0) {
        alert("Kechirasiz, mahsulot tugagan. Tez orada qayta keladi!");
        return;
      }
      
      qtyInput.value = 1;
      phoneInput.value = "";
      nameInput.value = "";
      addressInput.value = "";
      updateModalTotal(); // Ochilganda summani hisoblab qo'yish
      
      modal.classList.remove('modal-hidden');
      modal.classList.add('modal-flex');
      modalContent.classList.add('modal-content-show');
    }

    function closeModal() {
      // Yopilish animatsiyasini qo'shish uchun qisqa vaqt kutish kerak bo'lsa shunday qilinadi,
      // Hozircha oddiy yopamiz.
      modal.classList.add('modal-hidden');
      modal.classList.remove('modal-flex');
      modalContent.classList.remove('modal-content-show');
    }

    async function submitOrder() {
      const qty = parseInt(qtyInput.value);
      const phone = phoneInput.value.trim();
      const name = nameInput.value.trim() || "Ism kiritilmagan";
      const address = addressInput.value.trim() || "Manzil kiritilmagan";

      // 1. Validatsiya (Tekshirish)
      if (isNaN(qty) || qty < 1) {
        alert("❌ Iltimos, nechta dona kerakligini to‘g‘ri kiriting (kamida 1).");
        return;
      }
      if (qty > settings.stock) {
        alert(`❌ Omborxonada faqat ${settings.stock} dona mavjud. Iltimos, miqdorni kamaytiring.`);
        return;
      }
      if (!phone || phone.length < 9) {
        alert("❌ Iltimos, telefon raqamni to‘liq kiriting (+998 XX XXX XX XX).");
        return;
      }

      const totalAmount = qty * settings.price;
      const originalBtnText = confirmBtn.innerHTML;
      confirmBtn.disabled = true;
      confirmBtn.innerHTML = `<span class="animate-pulse">⏳ Yuborilmoqda...</span>`;

      let tgUserId = 0;
      if (window.Telegram?.WebApp?.initDataUnsafe?.user?.id) {
        tgUserId = window.Telegram.WebApp.initDataUnsafe.user.id;
      }

      try {
        // 2. Supabase'ga saqlash
        const { error: insertError } = await supabaseClient
          .from('orders')
          .insert([{
            telegram_user_id: tgUserId,
            customer_name: name,
            phone: phone,
            address: address,
            quantity: qty,
            total_amount: totalAmount,
            created_at: new Date().toISOString()
          }]);
        
        if (insertError) throw insertError;

        // 3. Ombor qoldig'ini yangilash
        const newStock = settings.stock - qty;
        await supabaseClient
          .from('bot_settings')
          .update({ stock: newStock })
          .eq('id', 1);

        // 4. ADMINGA TELEGRAMDAN XABAR YUBORISH (Yangi qism)
        const BOT_TOKEN = "7923250275:AAGBsEJakPV0aq2dOIpzczf3-0YH1SsaZCs";
        const ADMIN_ID = "7957774091"; // <-- BU YERGA O'Z ID RAQAMINGIZNI YOZING!
        
        const text = `🚀 *YANGI BUYURTMA!*\n\n` +
                     `👤 *Mijoz:* ${name}\n` +
                     `📞 *Tel:* ${phone}\n` +
                     `📦 *Soni:* ${qty} dona\n` +
                     `📍 *Manzil:* ${address}\n` +
                     `💰 *Summa:* ${totalAmount.toLocaleString('uz-UZ')} so'm\n` +
                     `🆔 *User ID:* ${tgUserId}`;

        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: ADMIN_ID,
            text: text,
            parse_mode: "Markdown"
          })
        });

        // 5. Muvaffaqiyatli tugatish
        settings.stock = newStock;
        updateUI();
        closeModal();
        alert(`🎉 Buyurtmangiz qabul qilindi!\nTez orada siz bilan bog'lanamiz.`);

      } catch (err) {
        console.error("Xatolik:", err);
        alert("Xatolik yuz berdi. Iltimos qaytadan urinib ko'ring.");
      } finally {
        confirmBtn.disabled = false;
        confirmBtn.innerHTML = originalBtnText;
      }
    }

    // Event listenerlar
    buyButton.addEventListener('click', openModal);
    closeModalBtn.addEventListener('click', closeModal);
    cancelBtn.addEventListener('click', closeModal);
    confirmBtn.addEventListener('click', submitOrder);
    
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    window.onload = () => {
      if (window.Telegram?.WebApp) {
        window.Telegram.WebApp.expand();
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.setHeaderColor("bg_color");
        window.Telegram.WebApp.setBackgroundColor("#0F172A");
      }
      loadData();
    };
  </script>
</body>
</html>
